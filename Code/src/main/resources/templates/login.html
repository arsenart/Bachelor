<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">

            <div class="text-center mb-4">
                <h4 class="fw-bold">Система управления закупками</h4>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h5 class="card-title mb-4">Вход</h5>

                    <div th:if="${param.error}" class="alert alert-danger py-2">
                        Неверный email или пароль.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-secondary py-2">
                        Вы вышли из системы.
                    </div>
                    <div th:if="${param.passwordSet}" class="alert alert-success py-2">
                        Пароль успешно установлен. Войдите в систему.
                    </div>

                    <form method="post" th:action="@{/login}">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <!-- Spring Security ожидает поле с именем "username" -->
                            <input type="email" name="username" class="form-control"
                                   placeholder="you@company.com" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Пароль</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Войти</button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
