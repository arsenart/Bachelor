<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{login.page_title}">Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">

            <!-- Language switcher -->
            <div class="text-end mb-2">
                <div class="btn-group btn-group-sm">
                    <a th:href="@{/login(lang='cs')}" class="btn btn-outline-secondary btn-sm"
                       th:text="#{lang.switch.cs}">CS</a>
                    <a th:href="@{/login(lang='en')}" class="btn btn-outline-secondary btn-sm"
                       th:text="#{lang.switch.en}">EN</a>
                </div>
            </div>

            <div class="text-center mb-4">
                <h4 class="fw-bold" th:text="#{app.name}">Procurement System</h4>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h5 class="card-title mb-4" th:text="#{login.heading}">Sign In</h5>

                    <div th:if="${param.error}" class="alert alert-danger py-2"
                         th:text="#{login.error}">Invalid email or password.</div>
                    <div th:if="${param.logout}" class="alert alert-secondary py-2"
                         th:text="#{login.logout}">You have been signed out.</div>
                    <div th:if="${param.passwordSet}" class="alert alert-success py-2"
                         th:text="#{login.password_set}">Password set successfully.</div>
                    <form method="post" th:action="@{/login}">
                        <div class="mb-3">
                            <label class="form-label" th:text="#{login.email}">Email</label>
                            <input type="email" name="username" class="form-control"
                                   placeholder="you@company.com" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" th:text="#{login.password}">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100"
                                th:text="#{login.submit}">Sign In</button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
