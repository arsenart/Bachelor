<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="#{dashboard.page_title}">Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <h4 class="mb-4" th:text="#{dashboard.title}">Dashboard</h4>

    <!-- REQUESTER stats -->
    <div sec:authorize="hasAnyRole('REQUESTER','ADMIN')">
        <h6 class="text-muted text-uppercase mb-3" th:text="#{dashboard.section.my_requests}">My Requests</h6>
        <div class="row g-3 mb-4">

            <div class="col-md-3">
                <div class="card text-bg-secondary h-100">
                    <div class="card-body">
                        <div class="fs-2 fw-bold" th:text="${myNewCount ?: 0}">0</div>
                        <div class="small" th:text="#{dashboard.card.drafts}">Drafts</div>
                    </div>
                    <div class="card-footer">
                        <a th:href="@{/requests(status='NEW')}" class="text-white text-decoration-none small"
                           th:text="#{dashboard.btn.view}">View →</a>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card text-bg-warning h-100">
                    <div class="card-body">
                        <div class="fs-2 fw-bold" th:text="${myPendingCount ?: 0}">0</div>
                        <div class="small" th:text="#{dashboard.card.pending}">Pending Approval</div>
                    </div>
                    <div class="card-footer">
                        <a th:href="@{/requests(status='PENDING_APPROVAL')}" class="text-dark text-decoration-none small"
                           th:text="#{dashboard.btn.view}">View →</a>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card text-bg-danger h-100">
                    <div class="card-body">
                        <div class="fs-2 fw-bold" th:text="${myReturnedCount ?: 0}">0</div>
                        <div class="small" th:text="#{dashboard.card.returned}">Returned for Revision</div>
                    </div>
                    <div class="card-footer">
                        <a th:href="@{/requests(status='RETURNED_FOR_REVISION')}" class="text-white text-decoration-none small"
                           th:text="#{dashboard.btn.view}">View →</a>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card text-bg-success h-100">
                    <div class="card-body">
                        <div class="fs-2 fw-bold" th:text="${myApprovedCount ?: 0}">0</div>
                        <div class="small" th:text="#{dashboard.card.approved}">Approved</div>
                    </div>
                    <div class="card-footer">
                        <a th:href="@{/requests(status='APPROVED')}" class="text-white text-decoration-none small"
                           th:text="#{dashboard.btn.view}">View →</a>
                    </div>
                </div>
            </div>

        </div>

        <a th:href="@{/requests/new}" class="btn btn-primary mb-4"
           th:text="#{dashboard.btn.new_request}">+ New Request</a>
    </div>

    <!-- APPROVER stats -->
    <div sec:authorize="hasAnyRole('APPROVER','ADMIN')">
        <h6 class="text-muted text-uppercase mb-3" th:text="#{dashboard.section.approvals}">Approvals</h6>
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card text-bg-primary h-100">
                    <div class="card-body">
                        <div class="fs-2 fw-bold" th:text="${pendingApprovalsCount ?: 0}">0</div>
                        <div class="small" th:text="#{dashboard.card.awaiting}">Awaiting Your Decision</div>
                    </div>
                    <div class="card-footer">
                        <a th:href="@{/approvals}" class="text-white text-decoration-none small"
                           th:text="#{dashboard.btn.review}">Review →</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ACCOUNTANT stats -->
    <div sec:authorize="hasAnyRole('ACCOUNTANT','ADMIN')">
        <h6 class="text-muted text-uppercase mb-3" th:text="#{dashboard.section.accounting}">Accounting</h6>
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card text-bg-info h-100">
                    <div class="card-body">
                        <div class="fs-2 fw-bold" th:text="${pendingDocumentsCount ?: 0}">0</div>
                        <div class="small" th:text="#{dashboard.card.pending_docs}">Pending Review</div>
                    </div>
                    <div class="card-footer">
                        <a th:href="@{/accounting}" class="text-white text-decoration-none small"
                           th:text="#{dashboard.btn.review}">Review →</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MY DOCUMENTS stats -->
    <div sec:authorize="hasAnyRole('REQUESTER','ACCOUNTANT','ADMIN')">
        <h6 class="text-muted text-uppercase mb-3" th:text="#{dashboard.section.my_docs}">My Documents</h6>
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card text-bg-secondary h-100">
                    <div class="card-body">
                        <div class="fs-2 fw-bold" th:text="${myDocsNewCount ?: 0}">0</div>
                        <div class="small" th:text="#{dashboard.card.doc_drafts}">Draft Documents</div>
                    </div>
                    <div class="card-footer">
                        <a th:href="@{/accounting(status='NEW')}" class="text-white text-decoration-none small"
                           th:text="#{dashboard.btn.view}">View →</a>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-bg-success h-100">
                    <div class="card-body">
                        <div class="fs-2 fw-bold" th:text="${myDocsPostedCount ?: 0}">0</div>
                        <div class="small" th:text="#{dashboard.card.doc_posted}">Posted</div>
                    </div>
                    <div class="card-footer">
                        <a th:href="@{/accounting(status='POSTED')}" class="text-white text-decoration-none small"
                           th:text="#{dashboard.btn.view}">View →</a>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-bg-primary h-100">
                    <div class="card-body">
                        <div class="fs-2 fw-bold" th:text="${myDocsPaidCount ?: 0}">0</div>
                        <div class="small" th:text="#{dashboard.card.doc_paid}">Paid</div>
                    </div>
                    <div class="card-footer">
                        <a th:href="@{/accounting(status='PAID')}" class="text-white text-decoration-none small"
                           th:text="#{dashboard.btn.view}">View →</a>
                    </div>
                </div>
            </div>
        </div>
        <a th:href="@{/accounting/new}" class="btn btn-outline-primary mb-4"
           th:text="#{dashboard.btn.new_document}">+ New Document</a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
