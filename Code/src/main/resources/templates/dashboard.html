<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <h4 class="mb-4">Dashboard</h4>

    <!-- REQUESTER stats -->
    <div sec:authorize="hasAnyRole('REQUESTER','ADMIN')">
        <h6 class="text-muted text-uppercase mb-3">My Requests</h6>
        <div class="row g-3 mb-4">

            <div class="col-md-3">
                <div class="card text-bg-secondary h-100">
                    <div class="card-body">
                        <div class="fs-2 fw-bold" th:text="${myNewCount ?: 0}">0</div>
                        <div class="small">Drafts</div>
                    </div>
                    <div class="card-footer">
                        <a th:href="@{/requests}" class="text-white text-decoration-none small">View →</a>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card text-bg-warning h-100">
                    <div class="card-body">
                        <div class="fs-2 fw-bold" th:text="${myPendingCount ?: 0}">0</div>
                        <div class="small">Pending Approval</div>
                    </div>
                    <div class="card-footer">
                        <a th:href="@{/requests}" class="text-dark text-decoration-none small">View →</a>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card text-bg-danger h-100">
                    <div class="card-body">
                        <div class="fs-2 fw-bold" th:text="${myReturnedCount ?: 0}">0</div>
                        <div class="small">Returned for Revision</div>
                    </div>
                    <div class="card-footer">
                        <a th:href="@{/requests}" class="text-white text-decoration-none small">View →</a>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card text-bg-success h-100">
                    <div class="card-body">
                        <div class="fs-2 fw-bold" th:text="${myApprovedCount ?: 0}">0</div>
                        <div class="small">Approved</div>
                    </div>
                    <div class="card-footer">
                        <a th:href="@{/requests}" class="text-white text-decoration-none small">View →</a>
                    </div>
                </div>
            </div>

        </div>

        <a th:href="@{/requests/new}" class="btn btn-primary mb-4">+ New Request</a>
    </div>

    <!-- APPROVER stats -->
    <div sec:authorize="hasAnyRole('APPROVER','ADMIN')">
        <h6 class="text-muted text-uppercase mb-3">Approvals</h6>
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card text-bg-primary h-100">
                    <div class="card-body">
                        <div class="fs-2 fw-bold" th:text="${pendingApprovalsCount ?: 0}">0</div>
                        <div class="small">Awaiting Your Decision</div>
                    </div>
                    <div class="card-footer">
                        <a th:href="@{/approvals}" class="text-white text-decoration-none small">Review →</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
