<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{approvals.page_title}">Pending Approvals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <h4 class="mb-3" th:text="#{approvals.title}">Pending Approvals</h4>

    <div th:if="${success}" class="alert alert-success alert-dismissible">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th th:text="#{approvals.table.id}">#</th>
                    <th th:text="#{approvals.table.title}">Title</th>
                    <th th:text="#{approvals.table.type}">Type</th>
                    <th th:text="#{approvals.table.amount}">Amount</th>
                    <th th:text="#{approvals.table.requested_by}">Requested by</th>
                    <th th:text="#{approvals.table.submitted}">Submitted</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="req : ${requests}">
                    <td th:text="${req.id}"></td>
                    <td th:text="${req.title}"></td>
                    <td>
                        <span th:text="${req.type}"
                              th:classappend="${req.type.name() == 'EXPENSE'} ? 'badge bg-info text-dark' : 'badge bg-secondary'"></span>
                    </td>
                    <td th:text="${#numbers.formatDecimal(req.amount,1,'COMMA',2,'POINT') + ' ' + req.currency}"></td>
                    <td th:text="${req.requestedBy.firstName + ' ' + req.requestedBy.lastName}"></td>
                    <td th:text="${#temporals.format(req.createdAt,'dd.MM.yyyy')}"></td>
                    <td>
                        <a th:href="@{/approvals/{id}(id=${req.id})}" class="btn btn-sm btn-primary"
                           th:text="#{approvals.btn.review}">Review</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(requests)}">
                    <td colspan="7" class="text-center text-muted py-4"
                        th:text="#{approvals.empty}">No requests pending your approval.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
