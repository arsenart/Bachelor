<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{approval.detail.page_title} + ': ' + ${request.title}">Approval Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <div th:if="${error}" class="alert alert-danger alert-dismissible">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">

        <!-- Request detail -->
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span class="fw-semibold" th:text="'#' + ${request.id} + ': ' + ${request.title}"></span>
                    <span th:text="#{status.request.__${request.status.name().toLowerCase()}__}"
                          th:class="${'badge fs-6 ' + (
                            request.status.name() == 'PENDING_APPROVAL' ? 'bg-warning text-dark' : 'bg-secondary')}">
                    </span>
                </div>
                <div class="card-body">
                    <dl class="row mb-0">
                        <dt class="col-sm-4" th:text="#{approval.detail.field.type}">Type</dt>
                        <dd class="col-sm-8" th:text="#{type.request.__${request.type.name().toLowerCase()}__}"></dd>

                        <dt class="col-sm-4" th:text="#{approval.detail.field.amount}">Amount</dt>
                        <dd class="col-sm-8 fw-bold text-primary"
                            th:text="${#numbers.formatDecimal(request.amount,1,'COMMA',2,'POINT') + ' ' + request.currency}"></dd>

                        <dt class="col-sm-4" th:text="#{approval.detail.field.supplier}">Supplier</dt>
                        <dd class="col-sm-8" th:text="${request.supplier ?: '—'}"></dd>

                        <dt class="col-sm-4" th:text="#{approval.detail.field.department}">Department</dt>
                        <dd class="col-sm-8" th:text="${request.department ?: '—'}"></dd>

                        <dt class="col-sm-4" th:text="#{approval.detail.field.needed_by}">Needed by</dt>
                        <dd class="col-sm-8"
                            th:text="${request.requestedDate != null ? #temporals.format(request.requestedDate,'dd.MM.yyyy') : '—'}"></dd>

                        <dt class="col-sm-4" th:text="#{approval.detail.field.requested_by}">Requested by</dt>
                        <dd class="col-sm-8"
                            th:text="${request.requestedBy.firstName + ' ' + request.requestedBy.lastName}"></dd>

                        <dt class="col-sm-4" th:if="${request.description}"
                            th:text="#{approval.detail.field.description}">Description</dt>
                        <dd class="col-sm-8" th:if="${request.description}" th:text="${request.description}"></dd>

                        <dt class="col-sm-4" th:if="${request.justification}"
                            th:text="#{approval.detail.field.justification}">Justification</dt>
                        <dd class="col-sm-8" th:if="${request.justification}" th:text="${request.justification}"></dd>

                        <dt class="col-sm-4" th:if="${request.documentLink}"
                            th:text="#{approval.detail.field.document_link}">Document Link</dt>
                        <dd class="col-sm-8" th:if="${request.documentLink}">
                            <a th:href="${request.documentLink}" target="_blank" rel="noopener"
                               th:text="${request.documentLink}" class="text-break"></a>
                        </dd>
                    </dl>
                </div>
            </div>

            <!-- Decision form — shown only if request is still pending -->
            <div class="card shadow-sm mt-3"
                 th:if="${request.status.name() == 'PENDING_APPROVAL'}">
                <div class="card-header fw-semibold" th:text="#{approval.decision.title}">Your Decision</div>
                <div class="card-body">

                    <div class="mb-3">
                        <label class="form-label">
                            <span th:text="#{approval.decision.comment}">Comment</span>
                            <span class="text-muted" th:text="'  ' + #{approval.decision.comment_hint}"></span>
                        </label>
                        <textarea id="commentField" class="form-control" rows="3"
                                  th:placeholder="#{approval.decision.comment_placeholder}"
                                  name="comment" form="decisionForm"></textarea>
                    </div>

                    <div class="d-flex gap-2 flex-wrap">
                        <form id="decisionForm"
                              th:action="@{/approvals/{id}/approve(id=${request.id})}"
                              method="post">
                            <input type="hidden" name="comment" id="approveComment">
                            <button type="submit" class="btn btn-success"
                                    th:text="#{approval.decision.approve}">✓ Approve</button>
                        </form>

                        <form th:action="@{/approvals/{id}/reject(id=${request.id})}" method="post">
                            <input type="hidden" name="comment" id="rejectComment">
                            <button type="submit" class="btn btn-danger"
                                    th:text="#{approval.decision.reject}">✗ Reject</button>
                        </form>

                        <form th:action="@{/approvals/{id}/return(id=${request.id})}" method="post">
                            <input type="hidden" name="comment" id="returnComment">
                            <button type="submit" class="btn btn-warning text-dark"
                                    th:text="#{approval.decision.return}">↩ Return for Revision</button>
                        </form>

                        <a th:href="@{/approvals}" class="btn btn-outline-secondary"
                           th:text="#{approval.decision.btn.back}">← Back</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Activity Log -->
        <div class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-header fw-semibold" th:text="#{approval.audit.title}">Activity Log</div>
                <div class="card-body p-0">
                    <ul class="list-group list-group-flush">
                        <li th:each="log : ${auditLog}" class="list-group-item py-2 px-3">
                            <div class="small fw-semibold" th:text="${log.action}"></div>
                            <div class="small text-muted">
                                <span th:if="${log.performedBy}"
                                      th:text="${log.performedBy.firstName + ' ' + log.performedBy.lastName + ' · '}"></span>
                                <span th:text="${#temporals.format(log.performedAt,'dd.MM.yyyy HH:mm')}"></span>
                            </div>
                            <div class="small fst-italic text-secondary"
                                 th:if="${log.comment}" th:text="${log.comment}"></div>
                        </li>
                        <li th:if="${#lists.isEmpty(auditLog)}"
                            class="list-group-item text-muted small py-3 text-center"
                            th:text="#{approval.audit.empty}">No activity yet.</li>
                    </ul>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    document.querySelectorAll('form button[type=submit]').forEach(btn => {
        btn.addEventListener('click', function () {
            const comment = document.getElementById('commentField').value;
            const form = this.closest('form');
            const hidden = form.querySelector('input[type=hidden][name=comment]');
            if (hidden) hidden.value = comment;
        });
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
