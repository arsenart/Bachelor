<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${requestId != null} ? #{request.edit.page_title} : #{request.new.page_title}">New Request</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">

            <h4 class="mb-4"
                th:text="${requestId != null} ? #{request.edit.title} : #{request.new.title}">New Request</h4>

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <form th:action="${requestId != null} ? @{/requests/{id}/edit(id=${requestId})} : @{/requests}"
                          method="post"
                          th:object="${requestDto}">

                        <div class="mb-3">
                            <label class="form-label" th:text="#{request.field.title}">Title *</label>
                            <input type="text" th:field="*{title}" class="form-control"
                                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                                   th:placeholder="#{request.field.title}">
                            <div class="invalid-feedback" th:errors="*{title}"></div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label" th:text="#{request.field.type}">Request Type *</label>
                                <select th:field="*{type}" class="form-select"
                                        th:classappend="${#fields.hasErrors('type')} ? 'is-invalid'">
                                    <option value="" th:text="#{request.field.type.select}">— Select —</option>
                                    <option th:each="t : ${requestTypes}"
                                            th:value="${t}"
                                            th:text="${t}"></option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{type}"></div>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label" th:text="#{request.field.amount}">Amount *</label>
                                <input type="number" th:field="*{amount}" class="form-control"
                                       th:classappend="${#fields.hasErrors('amount')} ? 'is-invalid'"
                                       step="0.01" min="0.01" placeholder="0.00">
                                <div class="invalid-feedback" th:errors="*{amount}"></div>
                            </div>

                            <div class="col-md-2">
                                <label class="form-label" th:text="#{request.field.currency}">Currency</label>
                                <select th:field="*{currency}" class="form-select">
                                    <option value="CZK">CZK</option>
                                    <option value="EUR">EUR</option>
                                </select>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label" th:text="#{request.field.supplier}">Supplier</label>
                                <input type="text" th:field="*{supplier}" class="form-control"
                                       th:placeholder="#{request.field.supplier.placeholder}">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label" th:text="#{request.field.department}">Department</label>
                                <input type="text" th:field="*{department}" class="form-control"
                                       th:placeholder="#{request.field.department.placeholder}">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label" th:text="#{request.field.needed_by}">Needed by</label>
                                <input type="date" th:field="*{requestedDate}" class="form-control">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" th:text="#{request.field.description}">Description</label>
                            <textarea th:field="*{description}" class="form-control" rows="2"
                                      th:placeholder="#{request.field.description.placeholder}"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" th:text="#{request.field.justification}">Justification</label>
                            <textarea th:field="*{justification}" class="form-control" rows="2"
                                      th:placeholder="#{request.field.justification.placeholder}"></textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" th:text="#{request.field.document_link}">Document Link</label>
                            <input type="url" th:field="*{documentLink}" class="form-control"
                                   th:placeholder="#{request.field.document_link.placeholder}">
                            <div class="form-text" th:text="#{request.field.document_link.hint}">Link to a quote...</div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary"
                                    th:text="#{btn.save_draft}">Save Draft</button>
                            <a th:href="@{/requests}" class="btn btn-outline-secondary"
                               th:text="#{btn.cancel}">Cancel</a>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
