<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${requestId != null} ? 'Edit Request' : 'New Request'">New Request</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">

            <h4 class="mb-4" th:text="${requestId != null} ? 'Edit Request' : 'New Request'">New Request</h4>

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <form th:action="${requestId != null} ? @{/requests/{id}/edit(id=${requestId})} : @{/requests}"
                          method="post"
                          th:object="${requestDto}">

                        <div class="mb-3">
                            <label class="form-label">Title *</label>
                            <input type="text" th:field="*{title}" class="form-control"
                                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                                   placeholder="e.g. Office supplies Q2">
                            <div class="invalid-feedback" th:errors="*{title}"></div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Request Type *</label>
                                <select th:field="*{type}" class="form-select"
                                        th:classappend="${#fields.hasErrors('type')} ? 'is-invalid'">
                                    <option value="">— Select —</option>
                                    <option th:each="t : ${requestTypes}"
                                            th:value="${t}"
                                            th:text="${t}"></option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{type}"></div>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Amount *</label>
                                <input type="number" th:field="*{amount}" class="form-control"
                                       th:classappend="${#fields.hasErrors('amount')} ? 'is-invalid'"
                                       step="0.01" min="0.01" placeholder="0.00">
                                <div class="invalid-feedback" th:errors="*{amount}"></div>
                            </div>

                            <div class="col-md-2">
                                <label class="form-label">Currency</label>
                                <select th:field="*{currency}" class="form-select">
                                    <option value="CZK">CZK</option>
                                    <option value="EUR">EUR</option>
                                </select>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Supplier</label>
                                <input type="text" th:field="*{supplier}" class="form-control"
                                       placeholder="Company or person name">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Department</label>
                                <input type="text" th:field="*{department}" class="form-control"
                                       placeholder="e.g. Finance">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Needed by</label>
                                <input type="date" th:field="*{requestedDate}" class="form-control">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea th:field="*{description}" class="form-control" rows="2"
                                      placeholder="What is being purchased or what expense is this?"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Justification</label>
                            <textarea th:field="*{justification}" class="form-control" rows="2"
                                      placeholder="Why is this purchase/expense necessary?"></textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Document Link</label>
                            <input type="url" th:field="*{documentLink}" class="form-control"
                                   placeholder="https://sharepoint... (optional)">
                            <div class="form-text">Link to a quote, invoice or supporting document.</div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Save Draft</button>
                            <a th:href="@{/requests}" class="btn btn-outline-secondary">Cancel</a>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
