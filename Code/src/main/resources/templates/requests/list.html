<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Requests</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>My Requests</h4>
        <a th:href="@{/requests/new}" class="btn btn-primary btn-sm">+ New Request</a>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Title</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Supplier</th>
                    <th>Status</th>
                    <th>Created</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="req : ${requests}">
                    <td th:text="${req.id}"></td>
                    <td th:text="${req.title}"></td>
                    <td>
                        <span th:text="${req.type}"
                              th:classappend="${req.type.name() == 'EXPENSE'} ? 'badge bg-info text-dark' : 'badge bg-secondary'"></span>
                    </td>
                    <td th:text="${#numbers.formatDecimal(req.amount, 1, 'COMMA', 2, 'POINT') + ' ' + req.currency}"></td>
                    <td th:text="${req.supplier ?: '—'}"></td>
                    <td>
                        <span th:text="${req.status}"
                              th:class="${'badge ' + (
                                req.status.name() == 'NEW'                     ? 'bg-secondary' :
                                req.status.name() == 'PENDING_APPROVAL'        ? 'bg-warning text-dark' :
                                req.status.name() == 'APPROVED'                ? 'bg-success' :
                                req.status.name() == 'REJECTED'                ? 'bg-danger' :
                                req.status.name() == 'RETURNED_FOR_REVISION'   ? 'bg-orange text-dark' :
                                'bg-light text-dark')}">
                        </span>
                    </td>
                    <td th:text="${#temporals.format(req.createdAt, 'dd.MM.yyyy')}"></td>
                    <td>
                        <a th:href="@{/requests/{id}(id=${req.id})}" class="btn btn-sm btn-outline-primary">View</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(requests)}">
                    <td colspan="8" class="text-center text-muted py-4">No requests yet. Create your first one.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
