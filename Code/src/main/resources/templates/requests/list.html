<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{requests.page_title}">My Requests</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 th:text="#{requests.title}">My Requests</h4>
        <a th:href="@{/requests/new}" class="btn btn-primary btn-sm"
           th:text="#{requests.btn.new}">+ New Request</a>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Filters -->
    <form method="get" th:action="@{/requests}" class="row g-2 mb-3">
        <div class="col-auto">
            <input type="text" name="search" class="form-control form-control-sm"
                   th:placeholder="#{filter.search}" th:value="${search}">
        </div>
        <div class="col-auto">
            <select name="status" class="form-select form-select-sm">
                <option value="" th:text="#{filter.all_statuses}">All statuses</option>
                <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s}"
                        th:selected="${s.name() == selectedStatus}"></option>
            </select>
        </div>
        <div class="col-auto">
            <select name="type" class="form-select form-select-sm">
                <option value="" th:text="#{filter.all_types}">All types</option>
                <option th:each="t : ${requestTypes}" th:value="${t.name()}" th:text="${t}"
                        th:selected="${t.name() == selectedType}"></option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-secondary btn-sm" th:text="#{filter.btn}">Filter</button>
        </div>
        <div class="col-auto" th:if="${selectedStatus != null or selectedType != null or search != null}">
            <a th:href="@{/requests}" class="btn btn-outline-danger btn-sm" th:text="#{filter.clear}">Clear</a>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th th:text="#{requests.table.id}">#</th>
                    <th th:text="#{requests.table.title}">Title</th>
                    <th th:text="#{requests.table.type}">Type</th>
                    <th th:text="#{requests.table.amount}">Amount</th>
                    <th th:text="#{requests.table.supplier}">Supplier</th>
                    <th th:text="#{requests.table.status}">Status</th>
                    <th th:text="#{requests.table.created}">Created</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="req : ${requests}">
                    <td th:text="${req.id}"></td>
                    <td th:text="${req.title}"></td>
                    <td>
                        <span th:text="#{type.request.__${req.type.name().toLowerCase()}__}"
                              th:classappend="${req.type.name() == 'EXPENSE'} ? 'badge bg-info text-dark' : 'badge bg-secondary'"></span>
                    </td>
                    <td th:text="${#numbers.formatDecimal(req.amount, 1, 'COMMA', 2, 'POINT') + ' ' + req.currency}"></td>
                    <td th:text="${req.supplier ?: '—'}"></td>
                    <td>
                        <span th:text="#{status.request.__${req.status.name().toLowerCase()}__}"
                              th:class="${'badge ' + (
                                req.status.name() == 'NEW'                     ? 'bg-secondary' :
                                req.status.name() == 'PENDING_APPROVAL'        ? 'bg-warning text-dark' :
                                req.status.name() == 'APPROVED'                ? 'bg-success' :
                                req.status.name() == 'REJECTED'                ? 'bg-danger' :
                                req.status.name() == 'RETURNED_FOR_REVISION'   ? 'bg-warning text-dark' :
                                'bg-light text-dark')}">
                        </span>
                    </td>
                    <td th:text="${#temporals.format(req.createdAt, 'dd.MM.yyyy')}"></td>
                    <td>
                        <a th:href="@{/requests/{id}(id=${req.id})}" class="btn btn-sm btn-outline-primary"
                           th:text="#{btn.view}">View</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(requests)}">
                    <td colspan="8" class="text-center text-muted py-4" th:text="#{requests.empty}">No requests yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
