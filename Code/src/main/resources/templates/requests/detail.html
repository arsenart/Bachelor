<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{request.detail.page_title} + ${request.id}">Request Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <div th:if="${success}" class="alert alert-success alert-dismissible">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">

        <!-- Main card -->
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span class="fw-semibold" th:text="'#' + ${request.id} + ': ' + ${request.title}"></span>
                    <span th:text="${request.status}"
                          th:class="${'badge fs-6 ' + (
                            request.status.name() == 'NEW'                   ? 'bg-secondary' :
                            request.status.name() == 'PENDING_APPROVAL'      ? 'bg-warning text-dark' :
                            request.status.name() == 'APPROVED'              ? 'bg-success' :
                            request.status.name() == 'REJECTED'              ? 'bg-danger' :
                            request.status.name() == 'RETURNED_FOR_REVISION' ? 'bg-warning text-dark' :
                            'bg-light text-dark')}">
                    </span>
                </div>
                <div class="card-body">
                    <dl class="row mb-0">
                        <dt class="col-sm-4" th:text="#{request.detail.field.type}">Type</dt>
                        <dd class="col-sm-8" th:text="${request.type}"></dd>

                        <dt class="col-sm-4" th:text="#{request.detail.field.amount}">Amount</dt>
                        <dd class="col-sm-8"
                            th:text="${#numbers.formatDecimal(request.amount,1,'COMMA',2,'POINT') + ' ' + request.currency}"></dd>

                        <dt class="col-sm-4" th:text="#{request.detail.field.supplier}">Supplier</dt>
                        <dd class="col-sm-8" th:text="${request.supplier ?: '—'}"></dd>

                        <dt class="col-sm-4" th:text="#{request.detail.field.department}">Department</dt>
                        <dd class="col-sm-8" th:text="${request.department ?: '—'}"></dd>

                        <dt class="col-sm-4" th:text="#{request.detail.field.needed_by}">Needed by</dt>
                        <dd class="col-sm-8"
                            th:text="${request.requestedDate != null ? #temporals.format(request.requestedDate,'dd.MM.yyyy') : '—'}"></dd>

                        <dt class="col-sm-4" th:text="#{request.detail.field.requested_by}">Requested by</dt>
                        <dd class="col-sm-8"
                            th:text="${request.requestedBy.firstName + ' ' + request.requestedBy.lastName}"></dd>

                        <dt class="col-sm-4" th:text="#{request.detail.field.created}">Created</dt>
                        <dd class="col-sm-8"
                            th:text="${#temporals.format(request.createdAt,'dd.MM.yyyy HH:mm')}"></dd>

                        <dt class="col-sm-4" th:if="${request.description}"
                            th:text="#{request.detail.field.description}">Description</dt>
                        <dd class="col-sm-8" th:if="${request.description}" th:text="${request.description}"></dd>

                        <dt class="col-sm-4" th:if="${request.justification}"
                            th:text="#{request.detail.field.justification}">Justification</dt>
                        <dd class="col-sm-8" th:if="${request.justification}" th:text="${request.justification}"></dd>
                    </dl>
                </div>

                <!-- Actions for owner -->
                <div class="card-footer d-flex gap-2 flex-wrap" th:if="${isOwner}">
                    <a th:if="${request.isEditable()}"
                       th:href="@{/requests/{id}/edit(id=${request.id})}"
                       class="btn btn-sm btn-outline-secondary"
                       th:text="#{request.detail.btn.edit}">Edit</a>

                    <form th:if="${request.isSubmittable()}"
                          method="post"
                          th:action="@{/requests/{id}/submit(id=${request.id})}">
                        <button type="submit" class="btn btn-sm btn-primary"
                                th:text="#{request.detail.btn.submit}">Submit for Approval</button>
                    </form>

                    <form th:if="${request.status.name() == 'APPROVED'}"
                          method="post"
                          th:action="@{/requests/{id}/realize(id=${request.id})}">
                        <button type="submit" class="btn btn-sm btn-success"
                                th:text="#{request.detail.btn.realize}">Mark as Realized</button>
                    </form>

                    <a th:if="${request.status.name() == 'APPROVED' or request.status.name() == 'REALIZED'}"
                       th:href="@{/accounting/new(requestId=${request.id})}"
                       class="btn btn-sm btn-outline-primary"
                       th:text="#{request.detail.btn.add_document}">+ Add Document</a>

                    <form th:if="${request.status.name() == 'REALIZED'}"
                          method="post"
                          th:action="@{/requests/{id}/close(id=${request.id})}">
                        <button type="submit" class="btn btn-sm btn-dark"
                                th:text="#{request.detail.btn.close}">Close</button>
                    </form>

                    <a th:href="@{/requests}" class="btn btn-sm btn-outline-secondary"
                       th:text="#{request.detail.btn.back}">← Back</a>
                </div>
            </div>

            <!-- Approval Steps Timeline -->
            <div class="card shadow-sm mt-3" th:if="${!#lists.isEmpty(request.steps)}">
                <div class="card-header fw-semibold" th:text="#{request.detail.steps.title}">Approval Steps</div>
                <div class="card-body">
                    <div th:each="step, i : ${request.steps}" class="d-flex mb-3">
                        <div class="me-3 text-center" style="min-width:32px">
                            <div th:class="${'rounded-circle d-flex align-items-center justify-content-center text-white fw-bold ' + (
                                step.status.name() == 'APPROVED'              ? 'bg-success' :
                                step.status.name() == 'REJECTED'              ? 'bg-danger' :
                                step.status.name() == 'RETURNED_FOR_REVISION' ? 'bg-warning' :
                                'bg-secondary')}"
                                 style="width:32px;height:32px;font-size:13px"
                                 th:text="${i.index + 1}">
                            </div>
                        </div>
                        <div>
                            <div class="fw-semibold"
                                 th:text="${step.approver.firstName + ' ' + step.approver.lastName}"></div>
                            <div class="small text-muted">
                                <span th:text="${step.status}"></span>
                                <span th:if="${step.decidedAt}"
                                      th:text="${' · ' + #temporals.format(step.decidedAt,'dd.MM.yyyy HH:mm')}"></span>
                            </div>
                            <div class="small fst-italic text-secondary mt-1"
                                 th:if="${step.comment}" th:text="${step.comment}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Audit Log -->
        <div class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-header fw-semibold" th:text="#{request.detail.audit.title}">Activity Log</div>
                <div class="card-body p-0">
                    <ul class="list-group list-group-flush">
                        <li th:each="log : ${auditLog}" class="list-group-item py-2 px-3">
                            <div class="small fw-semibold" th:text="${log.action}"></div>
                            <div class="small text-muted">
                                <span th:if="${log.performedBy}"
                                      th:text="${log.performedBy.firstName + ' ' + log.performedBy.lastName + ' · '}"></span>
                                <span th:text="${#temporals.format(log.performedAt,'dd.MM.yyyy HH:mm')}"></span>
                            </div>
                            <div class="small fst-italic text-secondary"
                                 th:if="${log.comment}" th:text="${log.comment}"></div>
                        </li>
                        <li th:if="${#lists.isEmpty(auditLog)}"
                            class="list-group-item text-muted small py-3 text-center"
                            th:text="#{request.detail.audit.empty}">No activity recorded.</li>
                    </ul>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
