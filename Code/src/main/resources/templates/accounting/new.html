<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${documentId != null} ? #{accounting.edit.page_title} : #{accounting.new.page_title}">New Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">

            <h4 class="mb-4"
                th:text="${documentId != null} ? #{accounting.edit.title} : #{accounting.new.title}">New Document</h4>

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <form th:action="${documentId != null} ? @{/accounting/{id}/edit(id=${documentId})} : @{/accounting}"
                          method="post"
                          th:object="${documentDto}">

                        <input type="hidden" th:field="*{approvalRequestId}">

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label" th:text="#{accounting.field.type}">Document Type *</label>
                                <select th:field="*{type}" class="form-select"
                                        th:classappend="${#fields.hasErrors('type')} ? 'is-invalid'">
                                    <option value="" th:text="#{request.field.type.select}">— Select —</option>
                                    <option th:each="t : ${documentTypes}"
                                            th:value="${t}"
                                            th:text="${t}"></option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{type}"></div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label" th:text="#{accounting.field.amount_no_vat}">Amount w/o VAT *</label>
                                <input type="number" th:field="*{amountWithoutVat}" class="form-control"
                                       th:classappend="${#fields.hasErrors('amountWithoutVat')} ? 'is-invalid'"
                                       step="0.01" min="0.01" placeholder="0.00">
                                <div class="invalid-feedback" th:errors="*{amountWithoutVat}"></div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label" th:text="#{accounting.field.amount_vat}">Amount w/ VAT</label>
                                <input type="number" th:field="*{amountWithVat}" class="form-control"
                                       step="0.01" placeholder="0.00">
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-3">
                                <label class="form-label" th:text="#{accounting.field.supplier_ico}">ICO</label>
                                <input type="text" th:field="*{supplierIco}" class="form-control"
                                       placeholder="12345678">
                            </div>
                            <div class="col-md-5">
                                <label class="form-label" th:text="#{accounting.field.supplier_name}">Supplier *</label>
                                <input type="text" th:field="*{supplierName}" class="form-control"
                                       th:classappend="${#fields.hasErrors('supplierName')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{supplierName}"></div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" th:text="#{accounting.field.tax_date}">Tax Date</label>
                                <input type="date" th:field="*{taxDate}" class="form-control">
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label" th:text="#{accounting.field.department}">Department</label>
                                <input type="text" th:field="*{department}" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" th:text="#{accounting.field.location}">Document Location</label>
                                <input type="text" th:field="*{documentLocation}" class="form-control"
                                       th:placeholder="#{accounting.field.location.placeholder}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" th:text="#{accounting.field.description}">Description</label>
                            <textarea th:field="*{description}" class="form-control" rows="2"></textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" th:text="#{accounting.field.justification}">Justification</label>
                            <textarea th:field="*{justification}" class="form-control" rows="2"></textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary"
                                    th:text="#{btn.save_draft}">Save Draft</button>
                            <a th:href="@{/accounting}" class="btn btn-outline-secondary"
                               th:text="#{btn.cancel}">Cancel</a>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
