<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="#{accounting.page_title}">Accounting Documents</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 th:text="#{accounting.title}">Accounting Documents</h4>
        <a th:href="@{/accounting/new}" class="btn btn-primary btn-sm"
           th:text="#{accounting.btn.new}">+ New Document</a>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Pending for accountant -->
    <div th:if="${isAccountant and !#lists.isEmpty(pendingDocuments)}" class="mb-4">
        <h6 class="text-muted text-uppercase mb-3" th:text="#{accounting.section.pending}">Pending Review</h6>
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>#</th>
                        <th th:text="#{accounting.table.type}">Type</th>
                        <th th:text="#{accounting.table.supplier}">Supplier</th>
                        <th th:text="#{accounting.table.amount}">Amount</th>
                        <th th:text="#{accounting.table.submitted_by}">Submitted by</th>
                        <th th:text="#{accounting.table.created}">Created</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="doc : ${pendingDocuments}">
                        <td th:text="${doc.id}"></td>
                        <td><span class="badge bg-info text-dark" th:text="${doc.type}"></span></td>
                        <td th:text="${doc.supplierName}"></td>
                        <td th:text="${#numbers.formatDecimal(doc.amountWithoutVat, 1, 'COMMA', 2, 'POINT') + ' CZK'}"></td>
                        <td th:text="${doc.submittedBy.firstName + ' ' + doc.submittedBy.lastName}"></td>
                        <td th:text="${#temporals.format(doc.createdAt, 'dd.MM.yyyy')}"></td>
                        <td>
                            <a th:href="@{/accounting/{id}(id=${doc.id})}" class="btn btn-sm btn-primary"
                               th:text="#{btn.review}">Review</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- My documents -->
    <h6 class="text-muted text-uppercase mb-3" th:text="#{accounting.section.my}">My Documents</h6>
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th th:text="#{accounting.table.type}">Type</th>
                    <th th:text="#{accounting.table.supplier}">Supplier</th>
                    <th th:text="#{accounting.table.amount}">Amount</th>
                    <th th:text="#{accounting.table.status}">Status</th>
                    <th th:text="#{accounting.table.created}">Created</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="doc : ${myDocuments}">
                    <td th:text="${doc.id}"></td>
                    <td><span class="badge bg-info text-dark" th:text="${doc.type}"></span></td>
                    <td th:text="${doc.supplierName}"></td>
                    <td th:text="${#numbers.formatDecimal(doc.amountWithoutVat, 1, 'COMMA', 2, 'POINT') + ' CZK'}"></td>
                    <td>
                        <span th:text="${doc.status}"
                              th:class="${'badge ' + (
                                doc.status.name() == 'NEW'                      ? 'bg-secondary' :
                                doc.status.name() == 'SUBMITTED_TO_ACCOUNTING'  ? 'bg-warning text-dark' :
                                doc.status.name() == 'RETURNED_FOR_COMPLETION'  ? 'bg-danger' :
                                doc.status.name() == 'POSTED'                   ? 'bg-primary' :
                                doc.status.name() == 'PAID'                     ? 'bg-success' :
                                doc.status.name() == 'CLOSED'                   ? 'bg-dark' :
                                'bg-light text-dark')}"></span>
                    </td>
                    <td th:text="${#temporals.format(doc.createdAt, 'dd.MM.yyyy')}"></td>
                    <td>
                        <a th:href="@{/accounting/{id}(id=${doc.id})}" class="btn btn-sm btn-outline-primary"
                           th:text="#{btn.view}">View</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(myDocuments)}">
                    <td colspan="7" class="text-center text-muted py-4"
                        th:text="#{accounting.empty}">No documents yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
