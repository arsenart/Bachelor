<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{accounting.detail.page_title} + ${doc.id}">Document Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <div th:if="${success}" class="alert alert-success alert-dismissible">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">

        <!-- Main card -->
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span class="fw-semibold" th:text="'#' + ${doc.id} + ': ' + ${doc.supplierName}"></span>
                    <span th:text="${doc.status}"
                          th:class="${'badge fs-6 ' + (
                            doc.status.name() == 'NEW'                      ? 'bg-secondary' :
                            doc.status.name() == 'SUBMITTED_TO_ACCOUNTING'  ? 'bg-warning text-dark' :
                            doc.status.name() == 'RETURNED_FOR_COMPLETION'  ? 'bg-danger' :
                            doc.status.name() == 'POSTED'                   ? 'bg-primary' :
                            doc.status.name() == 'PAID'                     ? 'bg-success' :
                            doc.status.name() == 'CLOSED'                   ? 'bg-dark' :
                            'bg-light text-dark')}"></span>
                </div>
                <div class="card-body">
                    <dl class="row mb-0">
                        <dt class="col-sm-4" th:text="#{accounting.detail.field.type}">Type</dt>
                        <dd class="col-sm-8" th:text="${doc.type}"></dd>

                        <dt class="col-sm-4" th:text="#{accounting.detail.field.amount_no_vat}">Amount w/o VAT</dt>
                        <dd class="col-sm-8 fw-bold"
                            th:text="${#numbers.formatDecimal(doc.amountWithoutVat,1,'COMMA',2,'POINT') + ' CZK'}"></dd>

                        <dt class="col-sm-4" th:if="${doc.amountWithVat != null}"
                            th:text="#{accounting.detail.field.amount_vat}">Amount w/ VAT</dt>
                        <dd class="col-sm-8" th:if="${doc.amountWithVat != null}"
                            th:text="${#numbers.formatDecimal(doc.amountWithVat,1,'COMMA',2,'POINT') + ' CZK'}"></dd>

                        <dt class="col-sm-4" th:text="#{accounting.detail.field.supplier}">Supplier</dt>
                        <dd class="col-sm-8" th:text="${(doc.supplierIco != null ? doc.supplierIco + ' — ' : '') + doc.supplierName}"></dd>

                        <dt class="col-sm-4" th:if="${doc.taxDate != null}"
                            th:text="#{accounting.detail.field.tax_date}">Tax Date</dt>
                        <dd class="col-sm-8" th:if="${doc.taxDate != null}"
                            th:text="${#temporals.format(doc.taxDate,'dd.MM.yyyy')}"></dd>

                        <dt class="col-sm-4" th:text="#{accounting.detail.field.department}">Department</dt>
                        <dd class="col-sm-8" th:text="${doc.department ?: '—'}"></dd>

                        <dt class="col-sm-4" th:text="#{accounting.detail.field.submitted_by}">Submitted by</dt>
                        <dd class="col-sm-8"
                            th:text="${doc.submittedBy.firstName + ' ' + doc.submittedBy.lastName}"></dd>

                        <dt class="col-sm-4" th:text="#{accounting.detail.field.created}">Created</dt>
                        <dd class="col-sm-8"
                            th:text="${#temporals.format(doc.createdAt,'dd.MM.yyyy HH:mm')}"></dd>

                        <dt class="col-sm-4" th:if="${doc.documentLocation}"
                            th:text="#{accounting.detail.field.location}">Location</dt>
                        <dd class="col-sm-8" th:if="${doc.documentLocation}" th:text="${doc.documentLocation}"></dd>

                        <dt class="col-sm-4" th:if="${doc.description}"
                            th:text="#{accounting.detail.field.description}">Description</dt>
                        <dd class="col-sm-8" th:if="${doc.description}" th:text="${doc.description}"></dd>

                        <dt class="col-sm-4" th:if="${doc.justification}"
                            th:text="#{accounting.detail.field.justification}">Justification</dt>
                        <dd class="col-sm-8" th:if="${doc.justification}" th:text="${doc.justification}"></dd>

                        <dt class="col-sm-4" th:if="${doc.approvalRequest != null}"
                            th:text="#{accounting.detail.field.linked_request}">Linked Request</dt>
                        <dd class="col-sm-8" th:if="${doc.approvalRequest != null}">
                            <a th:href="@{/requests/{id}(id=${doc.approvalRequest.id})}"
                               th:text="'#' + ${doc.approvalRequest.id} + ': ' + ${doc.approvalRequest.title}"></a>
                        </dd>

                        <dt class="col-sm-4" th:if="${doc.pohodaNumber}"
                            th:text="#{accounting.detail.field.pohoda}">Pohoda #</dt>
                        <dd class="col-sm-8" th:if="${doc.pohodaNumber}" th:text="${doc.pohodaNumber}"></dd>

                        <dt class="col-sm-4" th:if="${doc.dueDate != null}"
                            th:text="#{accounting.detail.field.due_date}">Due Date</dt>
                        <dd class="col-sm-8" th:if="${doc.dueDate != null}"
                            th:text="${#temporals.format(doc.dueDate,'dd.MM.yyyy')}"></dd>
                    </dl>
                </div>

                <!-- Owner actions -->
                <div class="card-footer d-flex gap-2" th:if="${isOwner}">
                    <a th:if="${doc.isEditable()}"
                       th:href="@{/accounting/{id}/edit(id=${doc.id})}"
                       class="btn btn-sm btn-outline-secondary"
                       th:text="#{btn.edit}">Edit</a>

                    <form th:if="${doc.isSubmittable()}"
                          method="post" th:action="@{/accounting/{id}/submit(id=${doc.id})}">
                        <button type="submit" class="btn btn-sm btn-primary"
                                th:text="#{accounting.btn.submit}">Submit to Accounting</button>
                    </form>

                    <a th:href="@{/accounting}" class="btn btn-sm btn-outline-secondary"
                       th:text="#{btn.back}">Back</a>
                </div>
            </div>

            <!-- Accountant actions -->
            <div class="card shadow-sm mt-3"
                 th:if="${isAccountant and doc.status.name() == 'SUBMITTED_TO_ACCOUNTING'}">
                <div class="card-header fw-semibold" th:text="#{accounting.action.title}">Accounting Actions</div>
                <div class="card-body">

                    <div class="mb-3">
                        <label class="form-label" th:text="#{accounting.action.pohoda}">Pohoda Number</label>
                        <input type="text" id="pohodaField" class="form-control form-control-sm" style="max-width:200px">
                    </div>

                    <div class="mb-3">
                        <label class="form-label" th:text="#{accounting.action.comment}">Comment (for return)</label>
                        <textarea id="returnComment" class="form-control" rows="2"></textarea>
                    </div>

                    <div class="d-flex gap-2 flex-wrap">
                        <form method="post" th:action="@{/accounting/{id}/post(id=${doc.id})}">
                            <input type="hidden" name="pohodaNumber" id="pohodaHidden">
                            <button type="submit" class="btn btn-primary"
                                    onclick="document.getElementById('pohodaHidden').value=document.getElementById('pohodaField').value"
                                    th:text="#{accounting.action.post}">Post</button>
                        </form>

                        <form method="post" th:action="@{/accounting/{id}/return(id=${doc.id})}">
                            <input type="hidden" name="comment" id="returnHidden">
                            <button type="submit" class="btn btn-warning text-dark"
                                    onclick="document.getElementById('returnHidden').value=document.getElementById('returnComment').value"
                                    th:text="#{accounting.action.return}">Return</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Pay / Close actions -->
            <div class="card shadow-sm mt-3"
                 th:if="${isAccountant and doc.status.name() == 'POSTED'}">
                <div class="card-footer d-flex gap-2">
                    <form method="post" th:action="@{/accounting/{id}/pay(id=${doc.id})}">
                        <button type="submit" class="btn btn-success"
                                th:text="#{accounting.action.pay}">Mark as Paid</button>
                    </form>
                    <form method="post" th:action="@{/accounting/{id}/close(id=${doc.id})}">
                        <button type="submit" class="btn btn-dark"
                                th:text="#{accounting.action.close}">Close</button>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm mt-3"
                 th:if="${isAccountant and doc.status.name() == 'PAID'}">
                <div class="card-footer">
                    <form method="post" th:action="@{/accounting/{id}/close(id=${doc.id})}">
                        <button type="submit" class="btn btn-dark"
                                th:text="#{accounting.action.close}">Close</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Audit Log -->
        <div class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-header fw-semibold" th:text="#{accounting.audit.title}">Activity Log</div>
                <div class="card-body p-0">
                    <ul class="list-group list-group-flush">
                        <li th:each="log : ${auditLog}" class="list-group-item py-2 px-3">
                            <div class="small fw-semibold" th:text="${log.action}"></div>
                            <div class="small text-muted">
                                <span th:if="${log.performedBy}"
                                      th:text="${log.performedBy.firstName + ' ' + log.performedBy.lastName + ' · '}"></span>
                                <span th:text="${#temporals.format(log.performedAt,'dd.MM.yyyy HH:mm')}"></span>
                            </div>
                            <div class="small fst-italic text-secondary"
                                 th:if="${log.comment}" th:text="${log.comment}"></div>
                        </li>
                        <li th:if="${#lists.isEmpty(auditLog)}"
                            class="list-group-item text-muted small py-3 text-center"
                            th:text="#{accounting.audit.empty}">No activity yet.</li>
                    </ul>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
