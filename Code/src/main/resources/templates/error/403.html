<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{error.403.title}">403 — Access Denied</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5 text-center">
    <h1 class="display-1 text-muted">403</h1>
    <p class="lead" th:text="#{error.403.message}">You do not have permission to access this page.</p>
    <a th:href="@{/dashboard}" class="btn btn-primary" th:text="#{error.btn.home}">Back to Dashboard</a>
</div>
</body>
</html>
