<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{admin.rules.page_title}">Approval Rules</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <div th:if="${success}" class="alert alert-success alert-dismissible" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">

        <!-- Create rule form -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header fw-semibold" th:text="#{admin.rules.new_rule}">New Rule</div>
                <div class="card-body">
                    <form method="post" th:action="@{/admin/rules}">

                        <div class="mb-2">
                            <label class="form-label form-label-sm" th:text="#{admin.rules.field.request_type}">Request Type *</label>
                            <select name="requestType" class="form-select form-select-sm" required>
                                <option th:each="rt : ${requestTypes}" th:value="${rt}" th:text="${rt}"></option>
                            </select>
                        </div>

                        <div class="mb-2">
                            <label class="form-label form-label-sm" th:text="#{admin.rules.field.min_amount}">Min Amount</label>
                            <input type="number" step="0.01" name="minAmount" class="form-control form-control-sm">
                        </div>

                        <div class="mb-2">
                            <label class="form-label form-label-sm" th:text="#{admin.rules.field.max_amount}">Max Amount</label>
                            <input type="number" step="0.01" name="maxAmount" class="form-control form-control-sm">
                        </div>

                        <div class="mb-2">
                            <label class="form-label form-label-sm" th:text="#{admin.rules.field.approver}">Approver (specific user)</label>
                            <select name="approverId" class="form-select form-select-sm">
                                <option value="">— by role —</option>
                                <option th:each="u : ${approvers}" th:value="${u.id}"
                                        th:text="${u.firstName + ' ' + u.lastName + ' (' + u.email + ')'}"></option>
                            </select>
                        </div>

                        <div class="mb-2">
                            <label class="form-label form-label-sm" th:text="#{admin.rules.field.approver_role}">Approver Role (fallback)</label>
                            <select name="approverRole" class="form-select form-select-sm">
                                <option value="">—</option>
                                <option th:each="r : ${approverRoles}" th:value="${r}" th:text="${r}"></option>
                            </select>
                        </div>

                        <div class="mb-2">
                            <label class="form-label form-label-sm" th:text="#{admin.rules.field.step_order}">Step Order *</label>
                            <input type="number" name="stepOrder" class="form-control form-control-sm" value="1" min="1" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label form-label-sm" th:text="#{admin.rules.field.description}">Description</label>
                            <input type="text" name="description" class="form-control form-control-sm">
                        </div>

                        <button type="submit" class="btn btn-primary btn-sm w-100"
                                th:text="#{admin.rules.btn.create}">Create Rule</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Rules table -->
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header fw-semibold">
                    <span th:text="#{admin.rules.all}">All Rules</span>
                    <span class="badge bg-secondary ms-1" th:text="${#lists.size(rules)}"></span>
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover table-sm mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th th:text="#{admin.rules.table.type}">Type</th>
                            <th th:text="#{admin.rules.table.range}">Amount Range</th>
                            <th th:text="#{admin.rules.table.approver}">Approver</th>
                            <th th:text="#{admin.rules.table.step}">Step</th>
                            <th th:text="#{admin.rules.table.status}">Status</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="rule : ${rules}" th:class="${!rule.active ? 'table-secondary' : ''}">
                            <td th:text="${rule.id}"></td>
                            <td th:text="${rule.requestType}"></td>
                            <td>
                                <span th:text="${rule.minAmount != null ? rule.minAmount : '—'}"></span>
                                –
                                <span th:text="${rule.maxAmount != null ? rule.maxAmount : '∞'}"></span>
                            </td>
                            <td>
                                <span th:if="${rule.approver != null}"
                                      th:text="${rule.approver.firstName + ' ' + rule.approver.lastName}"></span>
                                <span th:if="${rule.approver == null && rule.approverRole != null}"
                                      class="badge bg-info" th:text="${rule.approverRole}"></span>
                                <span th:if="${rule.approver == null && rule.approverRole == null}">—</span>
                            </td>
                            <td th:text="${rule.stepOrder}"></td>
                            <td>
                                <span th:if="${rule.active}" class="badge bg-success"
                                      th:text="#{admin.rules.status.active}">Active</span>
                                <span th:unless="${rule.active}" class="badge bg-secondary"
                                      th:text="#{admin.rules.status.inactive}">Inactive</span>
                            </td>
                            <td class="d-flex gap-1">
                                <form method="post"
                                      th:action="@{/admin/rules/{id}/toggle(id=${rule.id})}">
                                    <button type="submit" class="btn btn-outline-warning btn-sm"
                                            th:text="${rule.active ? #{admin.rules.btn.disable} : #{admin.rules.btn.enable}}">Toggle</button>
                                </form>
                                <form method="post"
                                      th:action="@{/admin/rules/{id}/delete(id=${rule.id})}"
                                      onsubmit="return confirm('Delete this rule?')">
                                    <button type="submit" class="btn btn-outline-danger btn-sm"
                                            th:text="#{admin.rules.btn.delete}">Delete</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(rules)}">
                            <td colspan="7" class="text-center text-muted py-3"
                                th:text="#{admin.rules.empty}">No rules configured.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="small text-muted mt-2" th:text="#{admin.rules.hint}">
                Note: If a specific approver is selected, the role field is ignored.
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
