<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{admin.users.edit.page_title}">Edit User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header fw-semibold" th:text="#{admin.users.edit.title}">Edit User</div>
                <div class="card-body">
                    <form method="post" th:action="@{/admin/users/{id}/edit(id=${editUserId})}"
                          th:object="${editRequest}">

                        <div class="mb-3">
                            <label class="form-label" th:text="#{admin.users.field.email}">Email</label>
                            <input type="email" th:field="*{email}" class="form-control" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" th:text="#{admin.users.field.first_name}">First Name *</label>
                            <input type="text" th:field="*{firstName}" class="form-control"
                                   th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'" required>
                            <div class="invalid-feedback" th:errors="*{firstName}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" th:text="#{admin.users.field.last_name}">Last Name *</label>
                            <input type="text" th:field="*{lastName}" class="form-control"
                                   th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'" required>
                            <div class="invalid-feedback" th:errors="*{lastName}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" th:text="#{admin.users.field.department}">Department</label>
                            <input type="text" th:field="*{department}" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" th:text="#{admin.users.field.roles}">Roles *</label>
                            <div th:each="role : ${roles}" class="form-check">
                                <input class="form-check-input" type="checkbox"
                                       th:field="*{roles}" th:value="${role}"
                                       th:id="${'role-' + role}">
                                <label class="form-check-label" th:for="${'role-' + role}" th:text="${role}"></label>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary"
                                    th:text="#{admin.users.btn.save}">Save</button>
                            <a th:href="@{/admin/users}" class="btn btn-outline-secondary"
                               th:text="#{btn.cancel}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
