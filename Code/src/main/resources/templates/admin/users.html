<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Пользователи — Администратор</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Навигация -->
<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand fw-bold">Система управления закупками</span>
    <form method="post" th:action="@{/logout}" class="d-inline">
        <button type="submit" class="btn btn-outline-light btn-sm">Выйти</button>
    </form>
</nav>

<div class="container mt-4">

    <!-- Flash-сообщения -->
    <div th:if="${success}" class="alert alert-success alert-dismissible" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">

        <!-- Форма создания пользователя -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header fw-semibold">Новый пользователь</div>
                <div class="card-body">
                    <form method="post" th:action="@{/admin/users}" th:object="${createRequest}">

                        <div class="mb-2">
                            <label class="form-label form-label-sm">Email *</label>
                            <input type="email" th:field="*{email}" class="form-control form-control-sm"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" required>
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-2">
                            <label class="form-label form-label-sm">Имя *</label>
                            <input type="text" th:field="*{firstName}" class="form-control form-control-sm"
                                   th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'" required>
                            <div class="invalid-feedback" th:errors="*{firstName}"></div>
                        </div>

                        <div class="mb-2">
                            <label class="form-label form-label-sm">Фамилия *</label>
                            <input type="text" th:field="*{lastName}" class="form-control form-control-sm"
                                   th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'" required>
                            <div class="invalid-feedback" th:errors="*{lastName}"></div>
                        </div>

                        <div class="mb-2">
                            <label class="form-label form-label-sm">Отдел</label>
                            <input type="text" th:field="*{department}" class="form-control form-control-sm">
                        </div>

                        <div class="mb-3">
                            <label class="form-label form-label-sm">Роли *</label>
                            <div th:each="role : ${roles}" class="form-check">
                                <input class="form-check-input" type="checkbox"
                                       th:field="*{roles}" th:value="${role}"
                                       th:id="${'role-' + role}">
                                <label class="form-check-label" th:for="${'role-' + role}" th:text="${role}"></label>
                            </div>
                            <div th:if="${#fields.hasErrors('roles')}" class="text-danger small"
                                 th:errors="*{roles}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-sm w-100">
                            Создать и отправить письмо
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Таблица пользователей -->
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header fw-semibold">
                    Все пользователи
                    <span class="badge bg-secondary ms-1" th:text="${#lists.size(users)}"></span>
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover table-sm mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>Email</th>
                            <th>Имя</th>
                            <th>Отдел</th>
                            <th>Роли</th>
                            <th>Статус</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.email}"></td>
                            <td th:text="${user.firstName + ' ' + user.lastName}"></td>
                            <td th:text="${user.department}"></td>
                            <td>
                                <span th:each="role : ${user.roles}"
                                      class="badge bg-secondary me-1"
                                      th:text="${role}"></span>
                            </td>
                            <td>
                                <span th:if="${user.passwordSet}" class="badge bg-success">Активен</span>
                                <span th:unless="${user.passwordSet}" class="badge bg-warning text-dark">Ожидает активации</span>
                            </td>
                            <td>
                                <form th:unless="${user.passwordSet}"
                                      method="post"
                                      th:action="@{/admin/users/{id}/resend-setup-link(id=${user.id})}">
                                    <button type="submit" class="btn btn-outline-secondary btn-sm">
                                        Отправить повторно
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="6" class="text-center text-muted py-3">Пользователей пока нет.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
