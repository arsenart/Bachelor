<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="#{admin.users.page_title}">Users — Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <div th:if="${success}" class="alert alert-success alert-dismissible" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">

        <!-- Create user form -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header fw-semibold" th:text="#{admin.users.new_user}">New User</div>
                <div class="card-body">
                    <form method="post" th:action="@{/admin/users}" th:object="${createRequest}">

                        <div class="mb-2">
                            <label class="form-label form-label-sm" th:text="#{admin.users.field.email}">Email *</label>
                            <input type="email" th:field="*{email}" class="form-control form-control-sm"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" required>
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-2">
                            <label class="form-label form-label-sm"
                                   th:text="#{admin.users.field.first_name}">First Name *</label>
                            <input type="text" th:field="*{firstName}" class="form-control form-control-sm"
                                   th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'" required>
                            <div class="invalid-feedback" th:errors="*{firstName}"></div>
                        </div>

                        <div class="mb-2">
                            <label class="form-label form-label-sm"
                                   th:text="#{admin.users.field.last_name}">Last Name *</label>
                            <input type="text" th:field="*{lastName}" class="form-control form-control-sm"
                                   th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'" required>
                            <div class="invalid-feedback" th:errors="*{lastName}"></div>
                        </div>

                        <div class="mb-2">
                            <label class="form-label form-label-sm"
                                   th:text="#{admin.users.field.department}">Department</label>
                            <input type="text" th:field="*{department}" class="form-control form-control-sm">
                        </div>

                        <div class="mb-3">
                            <label class="form-label form-label-sm"
                                   th:text="#{admin.users.field.roles}">Roles *</label>
                            <div th:each="role : ${roles}" class="form-check">
                                <input class="form-check-input" type="checkbox"
                                       th:field="*{roles}" th:value="${role}"
                                       th:id="${'role-' + role}">
                                <label class="form-check-label" th:for="${'role-' + role}" th:text="${role}"></label>
                            </div>
                            <div th:if="${#fields.hasErrors('roles')}" class="text-danger small"
                                 th:errors="*{roles}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-sm w-100"
                                th:text="#{admin.users.btn.create}">Create and send email</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Users table -->
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header fw-semibold">
                    <span th:text="#{admin.users.all}">All Users</span>
                    <span class="badge bg-secondary ms-1" th:text="${#lists.size(users)}"></span>
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover table-sm mb-0">
                        <thead class="table-light">
                        <tr>
                            <th th:text="#{admin.users.table.email}">Email</th>
                            <th th:text="#{admin.users.table.name}">Name</th>
                            <th th:text="#{admin.users.table.department}">Department</th>
                            <th th:text="#{admin.users.table.roles}">Roles</th>
                            <th th:text="#{admin.users.table.status}">Status</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.email}"></td>
                            <td th:text="${user.firstName + ' ' + user.lastName}"></td>
                            <td th:text="${user.department}"></td>
                            <td>
                                <span th:each="role : ${user.roles}"
                                      class="badge bg-secondary me-1"
                                      th:text="${role}"></span>
                            </td>
                            <td>
                                <span th:if="${user.passwordSet}" class="badge bg-success"
                                      th:text="#{admin.users.status.active}">Active</span>
                                <span th:unless="${user.passwordSet}" class="badge bg-warning text-dark"
                                      th:text="#{admin.users.status.pending}">Pending Activation</span>
                            </td>
                            <td>
                                <form th:unless="${user.passwordSet}"
                                      method="post"
                                      th:action="@{/admin/users/{id}/resend-setup-link(id=${user.id})}">
                                    <button type="submit" class="btn btn-outline-secondary btn-sm"
                                            th:text="#{admin.users.btn.resend}">Resend</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="6" class="text-center text-muted py-3"
                                th:text="#{admin.users.empty}">No users yet.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
