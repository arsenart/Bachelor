<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{audit.page_title}">Audit Log</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <h3 th:text="#{audit.title}">Audit Log</h3>

    <div th:if="${#lists.isEmpty(logs)}" class="alert alert-info" th:text="#{audit.empty}">No audit records.</div>

    <div th:unless="${#lists.isEmpty(logs)}" class="table-responsive">
        <table class="table table-striped table-sm">
            <thead class="table-dark">
                <tr>
                    <th th:text="#{audit.table.date}">Date</th>
                    <th th:text="#{audit.table.user}">User</th>
                    <th th:text="#{audit.table.entity}">Entity</th>
                    <th th:text="#{audit.table.action}">Action</th>
                    <th th:text="#{audit.table.old_value}">Old Value</th>
                    <th th:text="#{audit.table.new_value}">New Value</th>
                    <th th:text="#{audit.table.comment}">Comment</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="log : ${logs}">
                    <td th:text="${#temporals.format(log.performedAt, 'dd.MM.yyyy HH:mm')}"></td>
                    <td th:text="${log.performedBy != null} ? ${log.performedBy.firstName + ' ' + log.performedBy.lastName} : 'System'"></td>
                    <td>
                        <span th:text="${log.entityType}"></span>
                        <span class="text-muted">#<span th:text="${log.entityId}"></span></span>
                    </td>
                    <td><span class="badge bg-secondary" th:text="${log.action}"></span></td>
                    <td th:text="${log.oldValue}" class="text-muted"></td>
                    <td th:text="${log.newValue}"></td>
                    <td th:text="${log.comment}" class="text-muted small"></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
