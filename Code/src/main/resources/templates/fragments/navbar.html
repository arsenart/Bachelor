<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" th:href="@{/dashboard}">Procurement System</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">

            <li class="nav-item">
                <a class="nav-link" th:href="@{/dashboard}"
                   th:classappend="${#httpServletRequest.requestURI == '/dashboard'} ? 'active'">
                    Dashboard
                </a>
            </li>

            <li class="nav-item" sec:authorize="hasAnyRole('REQUESTER','ADMIN')">
                <a class="nav-link" th:href="@{/requests}"
                   th:classappend="${#httpServletRequest.requestURI.startsWith('/requests')} ? 'active'">
                    My Requests
                </a>
            </li>

            <li class="nav-item" sec:authorize="hasAnyRole('APPROVER','ADMIN')">
                <a class="nav-link" th:href="@{/approvals}"
                   th:classappend="${#httpServletRequest.requestURI.startsWith('/approvals')} ? 'active'">
                    Approvals
                </a>
            </li>

            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                <a class="nav-link" th:href="@{/admin/users}"
                   th:classappend="${#httpServletRequest.requestURI.startsWith('/admin')} ? 'active'">
                    Admin
                </a>
            </li>

        </ul>

        <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item me-3">
                <span class="text-light small" sec:authentication="name"></span>
            </li>
            <li class="nav-item">
                <form method="post" th:action="@{/logout}">
                    <button type="submit" class="btn btn-outline-light btn-sm">Sign out</button>
                </form>
            </li>
        </ul>
    </div>
</nav>

</body>
</html>
