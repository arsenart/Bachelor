<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Установка пароля</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">

            <div class="text-center mb-4">
                <h4 class="fw-bold">Система управления закупками</h4>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h5 class="card-title mb-4">Установка пароля</h5>

                    <!-- Токен недействителен -->
                    <div th:unless="${validToken}">
                        <div class="alert alert-danger" th:text="${error}">Ссылка недействительна.</div>
                        <p class="text-muted text-center">Обратитесь к администратору для получения новой ссылки.</p>
                    </div>

                    <!-- Токен валиден — показываем форму -->
                    <form th:if="${validToken}" method="post" th:action="@{/setup-password}"
                          th:object="${setupRequest}">

                        <input type="hidden" th:field="*{token}">

                        <div th:if="${#fields.hasErrors('newPassword')}" class="alert alert-danger py-2">
                            <span th:errors="*{newPassword}"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Новый пароль</label>
                            <input type="password" th:field="*{newPassword}" class="form-control"
                                   placeholder="Минимум 8 символов" required minlength="8">
                            <div class="form-text">Минимум 8 символов.</div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Установить пароль</button>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
