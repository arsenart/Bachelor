<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{setup.page_title}">Password Setup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">

            <!-- Language switcher -->
            <div class="text-end mb-2">
                <div class="btn-group btn-group-sm">
                    <a th:href="@{''(lang='cs')}" class="btn btn-outline-secondary btn-sm"
                       th:text="#{lang.switch.cs}">CS</a>
                    <a th:href="@{''(lang='en')}" class="btn btn-outline-secondary btn-sm"
                       th:text="#{lang.switch.en}">EN</a>
                </div>
            </div>

            <div class="text-center mb-4">
                <h4 class="fw-bold" th:text="#{app.name}">Procurement System</h4>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h5 class="card-title mb-4" th:text="#{setup.heading}">Password Setup</h5>

                    <!-- Invalid token -->
                    <div th:unless="${validToken}">
                        <div class="alert alert-danger" th:text="${error} ?: #{setup.invalid_link}">Link is invalid.</div>
                        <p class="text-muted text-center" th:text="#{setup.contact_admin}">Contact administrator.</p>
                    </div>

                    <!-- Valid token — show form -->
                    <form th:if="${validToken}" method="post" th:action="@{/setup-password}"
                          th:object="${setupRequest}">

                        <input type="hidden" th:field="*{token}">

                        <div th:if="${#fields.hasErrors('newPassword')}" class="alert alert-danger py-2">
                            <span th:errors="*{newPassword}"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" th:text="#{setup.new_password}">New Password</label>
                            <input type="password" th:field="*{newPassword}" class="form-control"
                                   th:placeholder="#{setup.placeholder}" required minlength="8">
                            <div class="form-text" th:text="#{setup.hint}">At least 8 characters.</div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100"
                                th:text="#{setup.submit}">Set Password</button>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
