spring:
  application:
    name: procurement-system
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bachelor}
    username: ${DB_USERNAME:arsenart}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  admin:
    email: ${ADMIN_EMAIL:admin@company.com}
    password: ${ADMIN_PASSWORD:admin123}
  mail:
    from: ${MAIL_FROM:noreply@medicton.com}
    brevo-api-key: ${BREVO_API_KEY:}
