    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:0f9e58606c838b}
    password: ${MAIL_PASSWORD:7105bc4ba9f5c6}
    properties:
      mail:
        smtp:
          auth: true
          starttls.enable: true

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
